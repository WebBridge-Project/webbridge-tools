[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "webbridge-tools"
version = "1.0.0"
description = "The Python code generator for the webbridge C++ framework (C++ registration + TypeScript bindings), as a pip/conda-installable package"
readme = "README.md"
license = "MIT"
authors = [{ name = "F&S Bondtec Semiconductor GmbH" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "jinja2>=3.1,<4",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-cpp>=0.23,<0.24",
]

[project.urls]
Homepage = "https://github.com/fsbondtec/webbridge-tools"
Repository = "https://github.com/fsbondtec/webbridge-tools"
Issues = "https://github.com/fsbondtec/webbridge-tools/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
webbridge-generate = "webbridge_tools.tools.generate:main"
webbridge-discoverer = "webbridge_tools.tools.discoverer:main"
webbridge-parser = "webbridge_tools.tools.parser:main"

[tool.setuptools]
# tools/ and cmake/ live at the project root (not under src/webbridge_tools/)
# for repository layout parity with the upstream webbridge repo, but still
# install as the webbridge_tools.tools / webbridge_tools.cmake subpackages -
# i.e. nested under webbridge_tools/ in the installed distribution, exactly
# where the code (Path(__file__).parent-relative lookups) expects them.
packages = ["webbridge_tools", "webbridge_tools.tools", "webbridge_tools.tools.templates", "webbridge_tools.cmake"]

[tool.setuptools.package-dir]
webbridge_tools = "src/webbridge_tools"
"webbridge_tools.tools" = "tools"
"webbridge_tools.cmake" = "cmake"

[tool.setuptools.package-data]
"webbridge_tools.tools.templates" = ["*.j2"]
"webbridge_tools.cmake" = ["*.cmake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
