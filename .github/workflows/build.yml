name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Install built wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Smoke test console scripts
        shell: bash
        run: |
          python -c "import webbridge_tools.tools.generate, webbridge_tools.tools.discoverer, webbridge_tools.tools.parser"
          webbridge-generate --help
          webbridge-parser --help
          python -m webbridge_tools --cmake-dir

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-py${{ matrix.python-version }}
          path: dist/*
